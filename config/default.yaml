# Controller parameters. status: tuning -> values may still change on the tuning sequence.
# Final runs must use config/frozen.yaml (written by `make freeze`, guide section 2.2).
status: tuning

quality:            # Eq. 1
  alpha: 0.4
  beta: 0.4
  gamma: 0.2

scheduler:          # Fig. 2
  tau_Q: 0.6        # on the normalised quality scale Q / Q_clear_mean (DECISIONS D6)
  tau_E1: 0.6       # fraction of E0
  tau_E2: 0.3       # fraction of E0
  hysteresis: 0.02
  min_dwell_s: 2.0
  thermal_priority_weight: 0.7   # lower bound on omega_TH while Q_RGB < tau_Q and Q_TH >= tau_Q
  n_min_per_modality: 50
  thermal_off_rule: true         # D9: thermal sensor off at Level 1/2 while RGB quality is good
  recovery_hold_s: 2.0           # D10: Level 0 feature budget until tracking has been OK this long
  levels:
    - {name: normal,            n_features: 1200, min_keyframe_interval: 0,  local_ba: true, loop_closure: full}
    - {name: energy_saving,     n_features: 800,  min_keyframe_interval: 15, local_ba: true, loop_closure: reduced}
    - {name: tracking_priority, n_features: 600,  min_keyframe_interval: 30, local_ba: true, loop_closure: "off"}

energy:
  source: measured  # measured (RAPL) | model (comparison only)
  # E0 = k * (median measured energy of static_fusion on the same sequence and profile), DECISIONS D12.
  # run_matrix measures static_fusion first and passes E0 to the scheduler configurations.
  # tight: k = 1.0. generous: k = 1.05 / (1 - tau_E1), so static fusion's full run ends just above tau_E1
  # (DECISIONS v3, D12); computed by run_matrix from the tau_E1 in this file.
  budgets: [tight, generous]
